name: Import uploaded marketing skills source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-uploaded-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact source revision
        shell: bash
        run: |
          set -euo pipefail
          git remote add source https://github.com/coreyhaines31/marketingskills.git
          git fetch --depth=1 source f0c3fe888786b9cb42cce7274e9bb87e07a95819

      - name: Publish source tree except source workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git read-tree FETCH_HEAD^{tree}

          # GitHub Actions' token cannot introduce new workflow files itself.
          git rm --cached --ignore-unmatch             .github/workflows/sync-skills.yml             .github/workflows/validate-skill.yml

          git checkout HEAD -- .github/workflows/import-uploaded-source.yml
          git add .github/workflows/import-uploaded-source.yml

          TREE="$(git write-tree)"
          PARENT="$(git rev-parse HEAD)"
          NEW_COMMIT="$(printf '%s\n' "Import Claude marketing skills source from uploaded archive" | git commit-tree "$TREE" -p "$PARENT")"

          git push origin "$NEW_COMMIT:refs/heads/main"
